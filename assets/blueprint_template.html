<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComfyUI Pipeline Blueprint</title>
<style>
  :root {
    --bg: #141418;
    --panel: #202028;
    --panel-header: #2b2b36;
    --border: #333342;
    --text-main: #f0f0f5;
    --text-dim: #9999aa;
    --MODEL: #b58df1;
    --CLIP: #ffd166;
    --VAE: #ff6b6b;
    --CONDITIONING: #f77f00;
    --LATENT: #c77dff;
    --IMAGE: #4cc9f0;
    --MASK: #e0e0e0;
    --AUDIO: #2ecc71;
    --CONTROL_NET: #00c2a8; /* 표준 8색 외 추가색 (ControlNet 사용 시) */
    --IPADAPTER: #ff8fb8;   /* 표준 8색 외 추가색 (IP-Adapter 사용 시) */
  }
  body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 24px;
    overflow-x: auto;
  }
  h2 { margin: 0 0 6px; font-size: 20px; }
  .legend {
    display: flex;
    gap: 18px;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 20px;
    align-items: center;
  }
  .canvas {
    position: relative;
    /* 노드 수에 맞춰 조정. 노드 폭 220px + 열 간격 30px 기준, 높이는 아래 노드 y 좌표 + 노드 높이 */
    width: 1530px;
    height: 760px;
    background: radial-gradient(#282838 1px, transparent 1px);
    background-size: 22px 22px;
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  svg.wires {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
  }
  path.wire {
    fill: none;
    stroke-width: 2.5px;
    opacity: 0.8;
    pointer-events: stroke;
    transition: opacity 0.15s, stroke-width 0.15s;
  }
  path.wire:hover {
    opacity: 1;
    stroke-width: 4.5px;
  }
  .node {
    position: absolute;
    width: 220px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.45);
    z-index: 5;
    box-sizing: border-box;
  }
  .node-header {
    background: var(--panel-header);
    padding: 7px 11px;
    border-radius: 7px 7px 0 0;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .badge {
    font-size: 10px;
    padding: 2px 5px;
    border-radius: 3px;
    background: #d35400;
    color: #fff;
  }
  .badge.custom { background: #2980b9; }
  .slots-grid {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
  }
  .col-in, .col-out {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .slot-row {
    position: relative;
    height: 22px;
    display: flex;
    align-items: center;
    font-size: 11px;
    font-weight: 600;
  }
  .col-in .slot-row { padding-left: 14px; }
  .col-out .slot-row { padding-right: 14px; justify-content: flex-end; }
  .socket {
    position: absolute;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    box-sizing: border-box;
  }
  .socket.required {
    background: currentColor;
    box-shadow: 0 0 5px currentColor;
  }
  .socket.optional {
    background: var(--panel);
    border: 2px solid currentColor;
  }
  .col-in .socket { left: -6px; }
  .col-out .socket { right: -6px; }
  .params {
    padding: 6px 10px 8px;
    font-size: 11px;
    color: var(--text-dim);
    border-top: 1px solid #282834;
    background: #191920;
    border-radius: 0 0 7px 7px;
    line-height: 1.4;
  }
  .node { cursor: help; }
  .tip {
    position: fixed;
    z-index: 100;
    max-width: 340px;
    background: #0e0e12;
    border: 1px solid #5a5a70;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--text-main);
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .tip.on { opacity: 1; }
  .tip .t { font-weight: 700; margin-bottom: 4px; color: #fff; }
  .tip p { margin: 3px 0; }
  .tip b { color: #ffd166; }
  .tables { max-width: 1530px; margin-top: 28px; }
  .tables h3 { font-size: 15px; margin: 22px 0 8px; }
  .tables p.note { font-size: 12px; color: var(--text-dim); margin: 0 0 8px; }
  .tables table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .tables th, .tables td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; vertical-align: top; }
  .tables th { background: var(--panel-header); }
  .tables td.dot { width: 10px; padding: 0; }
  .tables code { color: #ffd166; word-break: break-all; }
</style>
</head>
<body>

  <h2 id="wf-title">ComfyUI Pipeline Blueprint</h2>
  <div class="legend">
    <span>● 채워진 원: 필수 연결 슬롯</span>
    <span>○ 비어있는 원: 선택 연결 슬롯</span>
    <span>※ 노드 위에 마우스를 올리면 역할 설명이 뜹니다. 배선 위에 올리면 경로가 강조됩니다.</span>
  </div>

  <div class="canvas" id="canvas">
    <svg class="wires" id="wires"></svg>
  </div>
  <div class="tip" id="tip"></div>
  <div class="tables" id="tables"></div>

<script>
// AGENT INSTRUCTION: Replace WORKFLOW_DATA with the target pipeline nodes and links.
// node: { id, title, x, y, badge, inputs:[{name,type,required?}], outputs:[{name,type}], params:[string],
//         tip:[{label:"역할", text:"..."}, {label:"왜", text:"..."}] }   <- tip은 마우스 오버 말풍선(기획자 눈높이로 작성)
// 슬롯 name은 한 노드 안에서 입력끼리, 출력끼리 겹치지 않게 쓴다. 입력/출력 이름이 같아도(positive 등) 괜찮다.
const WORKFLOW_DATA = {
  title: "ComfyUI Pipeline Blueprint",
  nodes: [],
  links: []
};

function renderBlueprint(data) {
  document.getElementById("wf-title").textContent = data.title;
  const canvas = document.getElementById("canvas");
  const svg = document.getElementById("wires");

  const types = ["MODEL", "CLIP", "VAE", "CONDITIONING", "LATENT", "IMAGE", "MASK", "AUDIO", "CONTROL_NET", "IPADAPTER"];
  const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
  types.forEach(t => {
    const marker = document.createElementNS("http://www.w3.org/2000/svg", "marker");
    marker.setAttribute("id", `arrow-${t}`);
    marker.setAttribute("viewBox", "0 0 10 10");
    marker.setAttribute("refX", "6");
    marker.setAttribute("refY", "5");
    marker.setAttribute("markerWidth", "5.5");
    marker.setAttribute("markerHeight", "5.5");
    marker.setAttribute("orient", "auto-start-reverse");
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", "M 0 1 L 8 5 L 0 9 z");
    p.setAttribute("fill", `var(--${t})`);
    marker.appendChild(p);
    defs.appendChild(marker);
  });
  svg.appendChild(defs);

  data.nodes.forEach(n => {
    const el = document.createElement("div");
    el.className = "node";
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";

    const isCustom = n.badge && n.badge !== "Core";
    const inHtml = (n.inputs || []).map(s => `
      <div class="slot-row" style="color: var(--${s.type})">
        <span class="socket ${s.required !== false ? 'required' : 'optional'}" id="in-${n.id}-${s.name}"></span>
        <span>${s.name}</span>
      </div>`).join("");

    const outHtml = (n.outputs || []).map(s => `
      <div class="slot-row" style="color: var(--${s.type})">
        <span>${s.name}</span>
        <span class="socket ${s.required !== false ? 'required' : 'optional'}" id="out-${n.id}-${s.name}"></span>
      </div>`).join("");

    el.innerHTML = `
      <div class="node-header">
        <span>${n.title}</span>
        <span class="badge ${isCustom ? 'custom' : ''}">${n.badge || 'Core'}</span>
      </div>
      <div class="slots-grid">
        <div class="col-in">${inHtml}</div>
        <div class="col-out">${outHtml}</div>
      </div>
      <div class="params">${(n.params || []).join("<br>")}</div>
    `;
    canvas.appendChild(el);

    if (n.tip && n.tip.length) {
      const tip = document.getElementById("tip");
      el.addEventListener("mouseenter", () => {
        tip.innerHTML = `<div class="t">${n.title}</div>` +
          n.tip.map(t => `<p><b>${t.label}</b> ${t.text}</p>`).join("");
        tip.classList.add("on");
      });
      el.addEventListener("mousemove", e => {
        const w = tip.offsetWidth, h = tip.offsetHeight;
        let x = e.clientX + 16, y = e.clientY + 16;
        if (x + w > innerWidth - 8) x = e.clientX - w - 16;
        if (y + h > innerHeight - 8) y = e.clientY - h - 16;
        tip.style.left = Math.max(8, x) + "px";
        tip.style.top = Math.max(8, y) + "px";
      });
      el.addEventListener("mouseleave", () => tip.classList.remove("on"));
    }
  });

  requestAnimationFrame(() => {
    const cRect = canvas.getBoundingClientRect();
    data.links.forEach(l => {
      const outEl = document.getElementById(`out-${l.from[0]}-${l.from[1]}`);
      const inEl = document.getElementById(`in-${l.to[0]}-${l.to[1]}`);
      if (!outEl || !inEl) return;

      const r1 = outEl.getBoundingClientRect();
      const r2 = inEl.getBoundingClientRect();
      const x1 = r1.left + r1.width / 2 - cRect.left;
      const y1 = r1.top + r1.height / 2 - cRect.top;
      const x2 = r2.left + r2.width / 2 - cRect.left;
      const y2 = r2.top + r2.height / 2 - cRect.top;

      const dx = Math.max(Math.abs(x2 - x1) * 0.45, 50);
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M ${x1},${y1} C ${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`);
      path.setAttribute("class", "wire");
      path.setAttribute("stroke", `var(--${l.type})`);
      path.setAttribute("marker-end", `url(#arrow-${l.type})`);
      svg.appendChild(path);
    });
  });
}

renderBlueprint(WORKFLOW_DATA);

// 연결 확인표 + 필요 파일 표를 WORKFLOW_DATA 에서 자동 생성한다.
// 사용자가 ComfyUI 화면과 비교해 빠진 선·잘못 이은 선을 찾는 기준이다.
// WORKFLOW_DATA.files = [{ folder, name, size, note, url }] 를 넣으면 필요 파일 표도 나온다.
(function renderTables(data) {
  const box = document.getElementById("tables");
  const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const byId = {};
  data.nodes.forEach(n => byId[n.id] = n);
  let html = "";

  if (data.files && data.files.length) {
    html += `<h3>필요한 파일 (받아서 넣어야 하는 것)</h3>
      <p class="note">파일 이름은 한 글자라도 다르면 ComfyUI가 찾지 못하거나 다른 파일로 조용히 바꿉니다.</p>
      <table><tr><th>저장 폴더 (models 아래)</th><th>파일 이름</th><th>크기</th><th>비고 / 받는 곳</th></tr>` +
      data.files.map(f => `<tr><td><code>${esc(f.folder)}</code></td><td><code>${esc(f.name)}</code></td><td>${esc(f.size)}</td><td>${esc(f.note)} ${f.url ? '<br><code>' + esc(f.url) + '</code>' : ""}</td></tr>`).join("") +
      `</table>`;
  }

  html += `<h3>연결 확인표 (ComfyUI 화면과 비교하세요)</h3>
    <p class="note">도착 노드를 기준으로 정렬했습니다. 입력 칸마다 선이 이 표대로 들어와 있어야 합니다.</p>
    <table><tr><th>도착 노드</th><th>입력 칸</th><th>← 출발 노드</th><th>출력 칸</th><th>종류</th></tr>` +
    data.links.slice().sort((a, b) => a.to[0] - b.to[0]).map(l => {
      const f = byId[l.from[0]], t = byId[l.to[0]];
      return `<tr><td>${esc(t.title)}</td><td><code>${esc(l.to[1])}</code></td><td>${esc(f.title)}</td><td><code>${esc(l.from[1])}</code></td><td style="color:var(--${l.type})">${esc(l.type)}</td></tr>`;
    }).join("") + `</table>`;
  box.innerHTML = html;
})(WORKFLOW_DATA);
</script>
</body>
</html>
